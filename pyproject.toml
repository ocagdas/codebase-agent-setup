[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-agent-setup"
version = "1.1.1"
description = "Tool-neutral agent setup for a fleet of repositories: guides, handover continuity and portable capsules"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["ai-agents", "developer-tools", "llm", "agents-md", "configuration-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

# Standard library only: no runtime dependencies, so uvx/pipx installs are instant.
dependencies = []

[project.urls]
Homepage = "https://github.com/ocagdas/codebase-agent-setup"
Repository = "https://github.com/ocagdas/codebase-agent-setup"
Issues = "https://github.com/ocagdas/codebase-agent-setup/issues"
Documentation = "https://github.com/ocagdas/codebase-agent-setup#quickstart"



[project.scripts]
codebase-agent-setup = "codebase_agent_setup.cli:main"
cbsetup = "codebase_agent_setup.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.9", "build==1.6.1", "twine==7.0.0", "jsonschema==4.26.0", "PyYAML==6.0.3"]

[tool.setuptools]
packages = ["codebase_agent_setup"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.setuptools.package-data]
codebase_agent_setup = [
  "environment.yml",
  "project/ai_workflow/LICENSE", "project/*.md", "project/ai_workflow/*.md", "project/ai_workflow/*.json",
  "project/ai_workflow/*.yaml", "project/ai_workflow/knowledge/*.json",
  "project/ai_workflow/tools/*.py", "project/.github/*.md",
  "project/.cursor/rules/*.mdc"
]

[tool.setuptools.exclude-package-data]
codebase_agent_setup = ["**/test_*.py", "**/__pycache__/*", "**/settings.local.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv*", ".toolchains", ".ai_cache", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import modules from the standalone consumer payload.
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
