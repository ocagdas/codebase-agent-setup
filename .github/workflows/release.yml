name: Release readiness
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release-candidate:
    name: Validated release candidate
    needs: checks
    if: needs.checks.result == 'success' && needs.checks.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Build selected commit and verify tag when present
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/version.py classify-release --tag "$REF_NAME" --github-output
            python scripts/build_release.py --tag "$REF_NAME"
          else
            python scripts/build_release.py --candidate
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-candidate
          path: .quality/release/*
          if-no-files-found: error
